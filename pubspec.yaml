name: btd
description: AI-powered football predictions and betting tips.

publish_to: 'none'

version: 26.096.01+12

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  
  # Networking
  dio: ^5.4.1
  
  # HTML Parsing (for web scraping)
  html: ^0.15.5
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage (encrypted & structured)
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.1
  path: ^1.9.1
  
  # Utils
  intl: ^0.20.0
  url_launcher: ^6.3.1
  
  # Firebase (Push Notifications)
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.5.0
  
  # Ads
  google_mobile_ads: ^6.0.0
  
  # Background Tasks
  workmanager: ^0.9.0+3
  
  # UI Enhancements
  pull_to_refresh: ^2.0.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  connectivity_plus: ^6.0.5
  flutter_svg: ^2.2.3
  webview_flutter: ^4.13.1
  in_app_purchase: ^3.2.3
  purchases_flutter: ^8.7.0
  share_plus: ^12.0.1
  package_info_plus: ^9.0.0
  youtube_explode_dart: ^3.0.5
  in_app_review: ^2.0.11
  fl_chart: ^0.69.0
  flutter_inappwebview: ^6.1.5
  font_awesome_flutter: ^10.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/img.png"
  min_sdk_android: 24
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/img.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/teams/
    - assets/leagues/
